<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ćwiczenia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <section id="ekran-dzis" class="ekran aktywny">
      <h1>Dziś</h1>
      <p class="opis">Tutaj pojawią się dzisiejsze sesje.</p>
    </section>

    <section id="ekran-cwiczenia" class="ekran">
      <h1>Ćwiczenia</h1>

      <button class="przycisk" id="przycisk-nowe">+ Dodaj ćwiczenie</button>

      <div class="formularz" id="formularz-cwiczenia" hidden>
        <h2 class="tytul-formularza" id="tytul-formularza">Nowe ćwiczenie</h2>

        <label for="pole-nazwa">Nazwa</label>
        <input type="text" id="pole-nazwa" placeholder="Np. Wiosłowanie">

        <label for="pole-rodzaj">Rodzaj aktywności</label>
        <select id="pole-rodzaj"></select>

        <!-- Miara: serie i powtórzenia albo czas -->
        <div id="blok-miary-serie" hidden>
          <label for="pole-ilosc-typ">Miara ćwiczenia</label>
          <select id="pole-ilosc-typ">
            <option value="powtorzenia">Serie i powtórzenia</option>
            <option value="czas">Czas</option>
          </select>

          <div class="rzad" id="ilosc-powtorzenia">
            <div>
              <label for="pole-serie">Serie</label>
              <input type="number" id="pole-serie" min="0" inputmode="numeric" value="0">
            </div>
            <div>
              <label for="pole-powtorzenia">Powtórzenia</label>
              <input type="number" id="pole-powtorzenia" min="0" inputmode="numeric" value="0">
            </div>
          </div>

          <div class="rzad" id="ilosc-czas" hidden>
            <div>
              <label for="pole-czas">Czas</label>
              <input type="number" id="pole-czas" min="0" step="any" inputmode="decimal" value="0">
            </div>
            <div>
              <label for="pole-czas-jednostka">Jednostka</label>
              <select id="pole-czas-jednostka">
                <option value="s">sekundy</option>
                <option value="min">minuty</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Miara: dystans i czas (basen, bieganie) -->
        <div id="blok-sesja" hidden>
          <div class="rzad">
            <div>
              <label for="pole-sesja-dystans">Dystans</label>
              <input type="number" id="pole-sesja-dystans" min="0" step="any" inputmode="decimal" value="0">
            </div>
            <div>
              <label for="pole-sesja-dystans-jednostka">Jednostka</label>
              <select id="pole-sesja-dystans-jednostka">
                <option value="km">kilometry</option>
                <option value="m">metry</option>
              </select>
            </div>
          </div>
          <div class="rzad">
            <div>
              <label for="pole-sesja-czas">Czas</label>
              <input type="number" id="pole-sesja-czas" min="0" step="any" inputmode="decimal" value="0">
            </div>
            <div>
              <label for="pole-sesja-czas-jednostka">Jednostka</label>
              <select id="pole-sesja-czas-jednostka">
                <option value="min">minuty</option>
                <option value="s">sekundy</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Miara: powtórzenia i czas (trening statyczny) -->
        <div id="blok-statyczna" hidden>
          <div class="rzad">
            <div>
              <label for="pole-stat-powtorzenia">Powtórzenia</label>
              <input type="number" id="pole-stat-powtorzenia" min="0" inputmode="numeric" value="0">
            </div>
            <div>
              <label for="pole-stat-czas">Czas jednego powtórzenia</label>
              <input type="number" id="pole-stat-czas" min="0" step="any" inputmode="decimal" value="0">
            </div>
          </div>
          <div class="rzad">
            <div>
              <label for="pole-stat-czas-jednostka">Jednostka czasu</label>
              <select id="pole-stat-czas-jednostka">
                <option value="s">sekundy</option>
                <option value="min">minuty</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Partie mięśni: najpierw ptaszek, potem lista, potem podsumowanie -->
        <label class="wybor wybor-pelny">
          <input type="checkbox" id="pole-czy-partie">
          Ćwiczenie uwzględnia partię mięśni
        </label>

        <div class="panel" id="panel-partii" hidden>
          <div class="etykieta">Zaznacz partie mięśni</div>
          <div id="pole-partie" class="wybory"></div>
          <button class="przycisk" id="przycisk-gotowe">Gotowe</button>
        </div>

        <div class="podsumowanie" id="podsumowanie-partii" hidden>
          <div>
            <div class="etykieta-mala">Partie mięśni</div>
            <div class="podsumowanie-tekst" id="tekst-partii"></div>
          </div>
          <button class="akcja" id="przycisk-zmien-partie">Zmień</button>
        </div>

        <label for="pole-link">Link do filmu (opcjonalnie)</label>
        <input type="url" id="pole-link" placeholder="https://">

        <p class="blad" id="komunikat-bledu"></p>

        <div>
          <button class="przycisk" id="przycisk-zapisz">Zapisz</button>
          <button class="przycisk drugi" id="przycisk-anuluj">Anuluj</button>
        </div>
      </div>

      <div class="filtry" id="blok-filtrow" hidden>
        <label for="pole-szukaj" class="etykieta-pola">Szukaj ćwiczenia</label>
        <input type="search" id="pole-szukaj" placeholder="Wpisz nazwę">

        <div class="etykieta-pola">Partie mięśni</div>
        <div class="chipy" id="chipy-partie"></div>

        <div class="etykieta-pola">Rodzaj aktywności</div>
        <div class="chipy" id="chipy-rodzaje"></div>

        <button class="akcja" id="przycisk-wyczysc" hidden>Wyczyść filtry</button>
      </div>

      <p class="opis" id="pusta-lista">Nie masz jeszcze ćwiczeń. Dodaj pierwsze.</p>
      <p class="opis" id="brak-wynikow" hidden>Brak ćwiczeń dla wybranych filtrów.</p>
      <div id="lista-cwiczen"></div>
    </section>

    <section id="ekran-postep" class="ekran">
      <h1>Postęp</h1>
      <p class="opis">Tutaj będą cele i historia.</p>
      <button class="przycisk drugi" id="przycisk-reset">Wyczyść dane (tryb testowy)</button>
    </section>
  </main>

  <nav class="pasek">
    <button class="zakladka aktywna" data-ekran="ekran-dzis">Dziś</button>
    <button class="zakladka" data-ekran="ekran-cwiczenia">Ćwiczenia</button>
    <button class="zakladka" data-ekran="ekran-postep">Postęp</button>
  </nav>

  <script src="dane.js"></script>
  <script src="cwiczenia.js"></script>
  <script src="app.js"></script>
</body>
</html>
