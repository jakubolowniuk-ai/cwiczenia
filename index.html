<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ćwiczenia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <section id="ekran-dzis" class="ekran aktywny">
      <h1>Dziś</h1>
      <p class="opis">Tutaj pojawią się dzisiejsze sesje.</p>
    </section>

    <section id="ekran-cwiczenia" class="ekran">
      <h1>Ćwiczenia</h1>
      <p class="opis">Tutaj będzie baza ćwiczeń i treningi.</p>

      <!-- Test zapisu danych: usuniemy go w następnych krokach -->
      <p>Kategorie: <strong id="licznik-kategorii">0</strong></p>
      <p>Ćwiczenia: <strong id="licznik-cwiczen">0</strong></p>
      <button class="przycisk" id="przycisk-test">Dodaj testowe ćwiczenie</button>
      <button class="przycisk drugi" id="przycisk-reset">Wyczyść dane</button>
    </section>

    <section id="ekran-postep" class="ekran">
      <h1>Postęp</h1>
      <p class="opis">Tutaj będą cele i historia.</p>
    </section>
  </main>

  <nav class="pasek">
    <button class="zakladka aktywna" data-ekran="ekran-dzis">Dziś</button>
    <button class="zakladka" data-ekran="ekran-cwiczenia">Ćwiczenia</button>
    <button class="zakladka" data-ekran="ekran-postep">Postęp</button>
  </nav>

  <script src="dane.js"></script>
  <script src="app.js"></script>
</body>
</html>
