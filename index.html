<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ćwiczenia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <section id="ekran-dzis" class="ekran aktywny">
      <h1>Dziś</h1>
      <p class="opis">Tutaj pojawią się dzisiejsze sesje.</p>
    </section>

    <section id="ekran-cwiczenia" class="ekran">
      <h1>Ćwiczenia</h1>

      <button class="przycisk" id="przycisk-nowe">+ Dodaj ćwiczenie</button>

      <div class="formularz" id="formularz-cwiczenia" hidden>
        <label for="pole-nazwa">Nazwa</label>
        <input type="text" id="pole-nazwa" placeholder="Np. Wiosłowanie">

        <label for="pole-rodzaj">Rodzaj aktywności</label>
        <select id="pole-rodzaj"></select>

        <label for="pole-ilosc-typ">Miara ćwiczenia</label>
        <select id="pole-ilosc-typ">
          <option value="powtorzenia">Serie i powtórzenia</option>
          <option value="czas">Czas</option>
          <option value="dystans">Dystans</option>
        </select>

        <div class="rzad" id="ilosc-powtorzenia">
          <div>
            <label for="pole-serie">Serie</label>
            <input type="number" id="pole-serie" min="1" inputmode="numeric" placeholder="3">
          </div>
          <div>
            <label for="pole-powtorzenia">Powtórzenia</label>
            <input type="number" id="pole-powtorzenia" min="1" inputmode="numeric" placeholder="12">
          </div>
        </div>

        <div class="rzad" id="ilosc-czas" hidden>
          <div>
            <label for="pole-czas">Czas</label>
            <input type="number" id="pole-czas" min="1" inputmode="decimal" placeholder="30">
          </div>
          <div>
            <label for="pole-czas-jednostka">Jednostka</label>
            <select id="pole-czas-jednostka">
              <option value="s">sekundy</option>
              <option value="min">minuty</option>
            </select>
          </div>
        </div>

        <div class="rzad" id="ilosc-dystans" hidden>
          <div>
            <label for="pole-dystans">Dystans</label>
            <input type="number" id="pole-dystans" min="0" step="any" inputmode="decimal" placeholder="5">
          </div>
          <div>
            <label for="pole-dystans-jednostka">Jednostka</label>
            <select id="pole-dystans-jednostka">
              <option value="km">kilometry</option>
              <option value="m">metry</option>
            </select>
          </div>
        </div>

        <div class="etykieta">Partie mięśni</div>
        <div id="pole-partie" class="wybory"></div>

        <label for="pole-link">Link do filmu (opcjonalnie)</label>
        <input type="url" id="pole-link" placeholder="https://">

        <p class="blad" id="komunikat-bledu"></p>

        <div>
          <button class="przycisk" id="przycisk-zapisz">Zapisz</button>
          <button class="przycisk drugi" id="przycisk-anuluj">Anuluj</button>
        </div>
      </div>

      <p class="opis" id="pusta-lista">Nie masz jeszcze ćwiczeń. Dodaj pierwsze.</p>
      <div id="lista-cwiczen"></div>
    </section>

    <section id="ekran-postep" class="ekran">
      <h1>Postęp</h1>
      <p class="opis">Tutaj będą cele i historia.</p>
      <button class="przycisk drugi" id="przycisk-reset">Wyczyść dane (tryb testowy)</button>
    </section>
  </main>

  <nav class="pasek">
    <button class="zakladka aktywna" data-ekran="ekran-dzis">Dziś</button>
    <button class="zakladka" data-ekran="ekran-cwiczenia">Ćwiczenia</button>
    <button class="zakladka" data-ekran="ekran-postep">Postęp</button>
  </nav>

  <script src="dane.js"></script>
  <script src="cwiczenia.js"></script>
  <script src="app.js"></script>
</body>
</html>
